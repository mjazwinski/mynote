[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mynote"
version = "1.0.0"
description = "MyNote backend: REST API for categories and notes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "testcontainers[mongodb]>=4.8",
    "jsonschema>=4.22",
    "pyyaml>=6",
    "ruff>=0.6",
    "complexipy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mynote"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
